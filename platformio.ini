; ============================================================================
; PlayMode — PlatformIO Configuration
; ============================================================================
;
; Dual-core ESP32 architecture:
;   Core 0: WiFi, MIDI parsing, Power Manager, Web UI (loop)
;   Core 1: Real-time Scheduler, PCA/I²C, Safety Manager
;

; AUDIT FIX (P0.1): `src_dir` is a [platformio] section option, not an
; [env:...] one. Placed under [env:esp32] it was ignored and PlatformIO looked
; for sources in the default `src/` directory (which does not exist here).
[platformio]
; All source files are flat in play-mode/
; Compatible with Arduino IDE and PlatformIO without additional configuration.
src_dir = play-mode

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

; Third-party libraries
lib_deps =
    bblanchon/ArduinoJson@^7
    ; Pinned to >= 2.4.0: from that release setPWM() returns the I2C
    ; Wire.endTransmission() status, which pca_driver.cpp relies on to detect a
    ; failed write and latch a hardware fault (see AUDIT FIX P0-A).
    adafruit/Adafruit PWM Servo Driver Library@^2.4.0
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1
    lathoub/AppleMIDI@^3

; Serial upload speed
monitor_speed = 115200
upload_speed = 921600
